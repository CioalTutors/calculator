                        ) : (calcMode === 'EQN' && eqnState.type) ? (
                            eqnState.results ? (
                                <div className="flex flex-col h-full justify-between select-none">
                                    <div className="text-xs font-bold text-[#14532d] flex justify-between items-center">
                                        <span>{eqnState.results[eqnState.resultIdx]?.label || 'X'} =</span>
                                        <span className="text-[9px] opacity-75 font-normal">
                                            {eqnState.resultIdx + 1}/{eqnState.results.length}
                                        </span>
                                    </div>
                                    <div className="text-right text-2xl text-[#14532d] font-bold tracking-widest overflow-hidden mt-auto flex items-center justify-end">
                                        {renderResultDisplay(eqnState.results[eqnState.resultIdx]?.val || '0')}
                                    </div>
                                </div>
                            ) : (
                                renderEqnEditor()
                            )
                        ) : (
                            <>
                                {/* Expression Line with Cursor */}
                                <div 
                                    ref={scrollRef}
                                    className="text-base text-[#14532d] overflow-x-auto whitespace-nowrap scrollbar-hide w-full font-semibold tracking-wider h-7 mt-0.5 flex items-center"
                                >
                                    <span>{expression.slice(0, cursorPos)}</span>
                                    <span ref={cursorRef} className="cursor-blink"></span>
                                    <span>{expression.slice(cursorPos)}</span>
                                </div>

                                {/* Result Line with Proper Stacked Fraction Rendering (No Slash) */}
                                <div className="text-right text-2xl text-[#14532d] font-bold tracking-widest overflow-hidden mt-auto flex items-center justify-end">
                                    {renderResultDisplay(result || (expression ? '' : '0'))}
                                </div>
                            </>
                        )}
                      </>
                    )}
                </div>

                {/* --- Controls Section --- */}
                <div className="flex-1 flex flex-col gap-1">
                    
                    {/* Top Flanking Control Block with REPLAY Wheel in Center */}
                    <div className="grid grid-cols-5 gap-1.5 mb-1 items-center">
                        
                        {/* Left 2x2 Column: SHIFT, ALPHA / CALC, ∫dx */}
                        <div className="col-span-2 grid grid-cols-2 gap-1.5">
                            <CalculatorButton 
                                label="SHIFT" 
                                color="bg-[#568a2e]" 
                                isActive={isShift}
                                textClass="text-[10px] text-yellow-300 font-bold" 
                                shape="rounded-full" 
                                onClick={() => setIsShift(!isShift)}
                            />
                            <CalculatorButton 
                                label="ALPHA" 
                                color="bg-[#568a2e]" 
                                isActive={isAlpha}
                                textClass="text-[10px] text-red-300 font-bold" 
                                shape="rounded-full" 
                                onClick={() => setIsAlpha(!isAlpha)}
                            />
                            <CalculatorButton 
                                label="CALC" 
                                subShift="SOLVE" 
                                subAlpha="=" 
                                color="bg-[#1a4023]" 
                                onClick={() => {
                                    if (isAlpha) insert('=');
                                    else handleCalcKey();
                                }}
                            />
                            <CalculatorButton 
                                label="∫dx" 
                                subShift="d/dx" 
                                subAlpha=":" 
                                color="bg-[#1a4023]" 
                                onClick={() => {
                                    if (isAlpha) insert(':');
                                    else if (isShift) insert('d/dx(');
                                    else insert('∫(');
                                }}
                            />
                        </div>

                        {/* Center Column: 4-Way REPLAY Circular Disc */}
                        <div className="col-span-1 flex items-center justify-center">
                            <div className="w-[66px] h-[66px] bg-[#3f6212] rounded-full border-2 border-[#65a30d] shadow-[0_4px_10px_rgba(0,0,0,0.5)] relative flex items-center justify-center overflow-hidden">
                                <div className="absolute inset-0 rounded-full bg-gradient-to-b from-[#4d7c0f] to-[#1a2e05] opacity-90 pointer-events-none"></div>
                                <span className="text-[7px] text-[#ecfccb] font-extrabold z-10 tracking-tighter pointer-events-none">REPLAY</span>
                                
                                {/* 4-Way Click Zones */}
                                <div onClick={navigateHistoryUp} className="absolute top-0 left-0 right-0 h-5 cursor-pointer z-20 flex items-start justify-center active:bg-white/20">
                                    <span className="text-[8px] text-[#bef264] pointer-events-none mt-0.5">▲</span>
                                </div>
                                <div onClick={navigateHistoryDown} className="absolute bottom-0 left-0 right-0 h-5 cursor-pointer z-20 flex items-end justify-center active:bg-white/20">
                                    <span className="text-[8px] text-[#bef264] pointer-events-none mb-0.5">▼</span>
                                </div>
                                <div onClick={moveCursorLeft} className="absolute left-0 top-0 bottom-0 w-5 cursor-pointer z-20 flex items-center justify-start active:bg-white/20">
                                    <span className="text-[8px] text-[#bef264] pointer-events-none ml-1">◀</span>
                                </div>
                                <div onClick={moveCursorRight} className="absolute right-0 top-0 bottom-0 w-5 cursor-pointer z-20 flex items-center justify-end active:bg-white/20">
                                    <span className="text-[8px] text-[#bef264] pointer-events-none mr-1">▶</span>
                                </div>
                            </div>
                        </div>

                        {/* Right 2x2 Column: MODE, ON / x⁻¹, log_■ */}
                        <div className="col-span-2 grid grid-cols-2 gap-1.5">
                            <CalculatorButton 
                                label="MODE" 
                                subShift="SETUP" 
                                color="bg-[#568a2e]" 
                                textClass="text-[10px] text-white font-bold" 
                                shape="rounded-full" 
                                onClick={() => {
                                    if (isShift) { setActiveMenu('SETUP'); setIsShift(false); }
                                    else { setActiveMenu('MODE'); }
                                }}
                            />
                            <CalculatorButton 
                                label="ON" 
                                color="bg-[#568a2e]" 
                                textClass="text-[10px] text-white font-bold" 
                                shape="rounded-full" 
                                onClick={handlePowerOn}
                            />
                            <CalculatorButton 
                                label="x⁻¹" 
                                subShift="x!" 
                                color="bg-[#1a4023]" 
                                onClick={() => {
                                    if (isShift) insert('!');
                                    else insert('^(-1)');
                                }}
                            />
                            <CalculatorButton 
                                label="log_■" 
                                subShift="Σ" 
                                color="bg-[#1a4023]" 
                                onClick={() => {
                                    if (isShift) insert('Σ(');
                                    else insert('log(');
                                }}
                            />
                        </div>
                    </div>

                    {/* --- Scientific Function Grid (3 Rows x 6 Columns) --- */}
                    <div className="grid grid-cols-6 gap-1.5 mb-1">
                        
                        {/* Function Row 1: Fraction, Root, Square, Power, Log, Ln */}
                        <CalculatorButton 
                            label="믐" 
                            subShift="d/c" 
                            onClick={() => {
                                if (isShift) handleSD(true);
                                else insert('/');
                            }}
                        />
                        <CalculatorButton 
                            label="√■" 
                            subShift="³√" 
                            onClick={() => {
                                if (isShift) insert('³√(');
                                else insert('√(');
                            }}
                        />
                        <CalculatorButton 
                            label="x²" 
                            subShift="x³" 
                            onClick={() => {
                                if (isShift) insert('^3');
                                else insert('^2');
                            }}
                        />
                        <CalculatorButton 
                            label="x^■" 
                            subShift="ˣ√" 
                            onClick={() => {
                                if (isShift) insert('^(1/');
                                else insert('^');
                            }}
                        />
                        <CalculatorButton 
                            label="log" 
                            subShift="10^■" 
                            onClick={() => {
                                if (isShift) insert('10^(');
                                else insert('log(');
                            }}
                        />
                        <CalculatorButton 
                            label="ln" 
                            subShift="e^■" 
                            onClick={() => {
                                if (isShift) insert('e^(');
                                else insert('ln(');
                            }}
                        />

                        {/* Function Row 2: (-), DMS, hyp, sin, cos, tan */}
                        <CalculatorButton 
                            label="(-)" 
                            subShift="∠" 
                            subAlpha="A" 
                            onClick={() => {
                                if (isAlpha || stoActive || rclActive) handleVariableKey('A');
                                else if (isShift) insert('∠');
                                else insert('-');
                            }}
                        />
                        <CalculatorButton 
                            label="° ' ''" 
                            subShift="←" 
                            subAlpha="B" 
                            onClick={() => {
                                if (isAlpha || stoActive || rclActive) handleVariableKey('B');
                                else handleDMS();
                            }}
                        />
                        <CalculatorButton 
                            label="hyp" 
                            subAlpha="C" 
                            onClick={() => {
                                if (isAlpha || stoActive || rclActive) handleVariableKey('C');
                                else setActiveMenu('HYP');
                            }}
                        />
                        <CalculatorButton 
                            label="sin" 
                            subShift="sin⁻¹" 
                            subAlpha="D" 
                            onClick={() => {
                                if (isAlpha || stoActive || rclActive) handleVariableKey('D');
                                else if (isShift) insert('sin⁻¹(');
                                else insert('sin(');
                            }}
                        />
                        <CalculatorButton 
                            label="cos" 
                            subShift="cos⁻¹" 
                            subAlpha="E" 
                            onClick={() => {
                                if (isAlpha || stoActive || rclActive) handleVariableKey('E');
                                else if (isShift) insert('cos⁻¹(');
                                else insert('cos(');
                            }}
                        />
                        <CalculatorButton 
                            label="tan" 
                            subShift="tan⁻¹" 
                            subAlpha="F" 
                            onClick={() => {
                                if (isAlpha || stoActive || rclActive) handleVariableKey('F');
                                else if (isShift) insert('tan⁻¹(');
                                else insert('tan(');
                            }}
                        />

                        {/* Function Row 3: RCL, ENG, (, ), S<=>D, M+ */}
                        <CalculatorButton 
                            label="RCL" 
                            subShift="STO" 
                            onClick={() => {
                                if (isShift) {
                                    setStoActive(true);
                                    setRclActive(false);
                                    setIsShift(false);
                                } else {
                                    setRclActive(true);
                                    setStoActive(false);
                                }
                            }}
                        />
                        <CalculatorButton 
                            label="ENG" 
                            subShift="←" 
                            onClick={() => {
                                if (isShift) handleENG(true);
                                else handleENG(false);
                            }}
                        />
                        <CalculatorButton 
                            label="(" 
                            subShift="%" 
                            onClick={() => {
                                if (isShift) insert('/100');
                                else insert('(');
                            }}
                        />
                        <CalculatorButton 
                            label=")" 
                            subShift="," 
                            subAlpha="X" 
                            onClick={() => {
                                if (isAlpha || stoActive || rclActive) handleVariableKey('X');
                                else if (isShift) insert(',');
                                else insert(')');
                            }}
                        />
                        <CalculatorButton 
                            label="S⇔D" 
                            subShift="a b/c" 
                            subAlpha="Y" 
                            onClick={() => {
                                if (isAlpha || stoActive || rclActive) handleVariableKey('Y');
                                else if (isShift) handleSD(true);
                                else handleSD(false);
                            }}
                        />
                        <CalculatorButton 
                            label="M+" 
                            subShift="M-" 
                            subAlpha="M" 
                            onClick={() => {
                                if (isAlpha || stoActive || rclActive) handleVariableKey('M');
                                else if (isShift) handleMemoryAdd(true);
                                else handleMemoryAdd(false);
                            }}
                        />
                    </div>

                    {/* --- Number Keypad Matrix (4 Rows x 5 Columns) --- */}
                    <div className="grid grid-cols-5 gap-1.5 mt-0.5">
                        
                        {/* Keypad Row 1: 7, 8, 9, DEL, AC */}
                        <CalculatorButton 
                            label="7" 
                            subShift="CONST" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-lg font-bold" 
                            onClick={() => {
                                if (activeMenu) handleMenuSelect('7');
                                else if (isShift) setActiveMenu('CONST');
                                else insert('7');
                            }}
                        />
                        <CalculatorButton 
                            label="8" 
                            subShift="CONV" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-lg font-bold" 
                            onClick={() => {
                                if (activeMenu) handleMenuSelect('8');
                                else if (isShift) setActiveMenu('CONV');
                                else insert('8');
                            }}
                        />
                        <CalculatorButton 
                            label="9" 
                            subShift="CLR" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-lg font-bold" 
                            onClick={() => {
                                if (activeMenu) handleMenuSelect('9');
                                else if (isShift) setActiveMenu('CLR');
                                else insert('9');
                            }}
                        />
                        <CalculatorButton 
                            label="DEL" 
                            subShift="INS" 
                            color="bg-[#f59e0b]" 
                            textColor="text-slate-950" 
                            textClass="text-sm font-extrabold" 
                            onClick={deleteChar}
                        />
                        <CalculatorButton 
                            label="AC" 
                            subShift="OFF" 
                            color="bg-[#f59e0b]" 
                            textColor="text-slate-950" 
                            textClass="text-sm font-extrabold" 
                            onClick={() => {
                                if (isShift) handlePowerOff();
                                else clearAll();
                            }}
                        />

                        {/* Keypad Row 2: 4, 5, 6, ×, ÷ */}
                        <CalculatorButton 
                            label="4" 
                            subShift="MATRIX" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-lg font-bold" 
                            onClick={() => {
                                if (activeMenu) handleMenuSelect('4');
                                else insert('4');
                            }}
                        />
                        <CalculatorButton 
                            label="5" 
                            subShift="VECTOR" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-lg font-bold" 
                            onClick={() => {
                                if (activeMenu) handleMenuSelect('5');
                                else insert('5');
                            }}
                        />
                        <CalculatorButton 
                            label="6" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-lg font-bold" 
                            onClick={() => {
                                if (activeMenu) handleMenuSelect('6');
                                else insert('6');
                            }}
                        />
                        <CalculatorButton 
                            label="×" 
                            subShift="nPr" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-xl font-bold" 
                            onClick={() => {
                                if (isShift) insert('P');
                                else insert('×');
                            }}
                        />
                        <CalculatorButton 
                            label="÷" 
                            subShift="nCr" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-xl font-bold" 
                            onClick={() => {
                                if (isShift) insert('C');
                                else insert('÷');
                            }}
                        />

                        {/* Keypad Row 3: 1, 2, 3, +, - */}
                        <CalculatorButton 
                            label="1" 
                            subShift="STAT" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-lg font-bold" 
                            onClick={() => {
                                if (activeMenu) handleMenuSelect('1');
                                else insert('1');
                            }}
                        />
                        <CalculatorButton 
                            label="2" 
                            subShift="CMPLX" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-lg font-bold" 
                            onClick={() => {
                                if (activeMenu) handleMenuSelect('2');
                                else insert('2');
                            }}
                        />
                        <CalculatorButton 
                            label="3" 
                            subShift="BASE" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-lg font-bold" 
                            onClick={() => {
                                if (activeMenu) handleMenuSelect('3');
                                else insert('3');
                            }}
                        />
                        <CalculatorButton 
                            label="+" 
                            subShift="Pol" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-xl font-bold" 
                            onClick={() => {
                                if (isShift) insert('Pol(');
                                else insert('+');
                            }}
                        />
                        <CalculatorButton 
                            label="-" 
                            subShift="Rec" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-xl font-bold" 
                            onClick={() => {
                                if (isShift) insert('Rec(');
                                else insert('-');
                            }}
                        />

                        {/* Keypad Row 4: 0, •, ×10ˣ, Ans, = */}
                        <CalculatorButton 
                            label="0" 
                            subShift="Rnd" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-lg font-bold" 
                            onClick={() => {
                                if (activeMenu) handleMenuSelect('0');
                                else insert('0');
                            }}
                        />
                        <CalculatorButton 
                            label="•" 
                            subShift="Ran#" 
                            subAlpha="RanInt" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-lg font-bold" 
                            onClick={() => {
                                if (isAlpha) insert('RanInt#(');
                                else if (isShift) insert('Ran#');
                                else insert('.');
                            }}
                        />
                        <CalculatorButton 
                            label="×10ˣ" 
                            subShift="π" 
                            subAlpha="e" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-xs font-extrabold" 
                            onClick={() => {
                                if (isAlpha) insert('e');
                                else if (isShift) insert('π');
                                else insert('*10^');
                            }}
                        />
                        <CalculatorButton 
                            label="Ans" 
                            subShift="DRG▶" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-xs font-bold" 
                            onClick={() => {
                                if (isShift) setActiveMenu('DRG');
                                else insert('Ans');
                            }}
                        />
                        <CalculatorButton 
                            label="=" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-2xl font-black" 
                            onClick={() => {
                                if (activeMenu === 'CALC_INPUT') {
                                    const val = parseFloat(calcVarInput.value) || 0;
                                    setVariables(prev => ({ ...prev, [calcVarInput.varName]: val }));
                                    setActiveMenu(null);
                                    handleEvaluate();
                                } else if (calcMode === 'EQN' && eqnState.type) {
                                    handleEqnEquals();
                                } else {
                                    handleEvaluate();
                                }
                            }}
                        />
                    </div>
                </div>
                
                {/* Subtle bottom tag */}
                <div className="text-center text-[8px] text-[#bef264] opacity-60 mt-2">
                    Casio fx-991ES PLUS Natural-V.P.A.M. • Cioal Tutors Edition
                </div>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
