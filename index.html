                            onClick={() => {
                                if (activeMenu) handleMenuSelect('1');
                                else insert('1');
                            }}
                        />
                        <CalculatorButton 
                            label="2" 
                            subShift="CMPLX" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-lg font-bold" 
                            onClick={() => {
                                if (activeMenu) handleMenuSelect('2');
                                else insert('2');
                            }}
                        />
                        <CalculatorButton 
                            label="3" 
                            subShift="BASE" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-lg font-bold" 
                            onClick={() => {
                                if (activeMenu) handleMenuSelect('3');
                                else insert('3');
                            }}
                        />
                        <CalculatorButton 
                            label="+" 
                            subShift="Pol" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-xl font-bold" 
                            onClick={() => {
                                if (isShift) insert('Pol(');
                                else insert('+');
                            }}
                        />
                        <CalculatorButton 
                            label="-" 
                            subShift="Rec" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-xl font-bold" 
                            onClick={() => {
                                if (isShift) insert('Rec(');
                                else insert('-');
                            }}
                        />

                        {/* Keypad Row 4: 0, •, ×10ˣ, Ans, = */}
                        <CalculatorButton 
                            label="0" 
                            subShift="Rnd" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-lg font-bold" 
                            onClick={() => {
                                if (activeMenu) handleMenuSelect('0');
                                else insert('0');
                            }}
                        />
                        <CalculatorButton 
                            label="•" 
                            subShift="Ran#" 
                            subAlpha="RanInt" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-lg font-bold" 
                            onClick={() => {
                                if (isAlpha) insert('RanInt#(');
                                else if (isShift) insert('Ran#');
                                else insert('.');
                            }}
                        />
                        <CalculatorButton 
                            label="×10ˣ" 
                            subShift="π" 
                            subAlpha="e" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-xs font-extrabold" 
                            onClick={() => {
                                if (isAlpha) insert('e');
                                else if (isShift) insert('π');
                                else insert('*10^');
                            }}
                        />
                        <CalculatorButton 
                            label="Ans" 
                            subShift="DRG▶" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-xs font-bold" 
                            onClick={() => {
                                if (isShift) setActiveMenu('DRG');
                                else insert('Ans');
                            }}
                        />
                        <CalculatorButton 
                            label="=" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-2xl font-black" 
                            onClick={() => {
                                if (activeMenu === 'CALC_INPUT') {
                                    const val = parseFloat(calcVarInput.value) || 0;
                                    setVariables(prev => ({ ...prev, [calcVarInput.varName]: val }));
                                    setActiveMenu(null);
                                    handleEvaluate();
                                } else {
                                    handleEvaluate();
                                }
                            }}
                        />
                    </div>
                </div>
                
                {/* Subtle bottom tag */}
                <div className="text-center text-[8px] text-[#bef264] opacity-60 mt-2">
                    Casio fx-991ES PLUS Natural-V.P.A.M. • Cioal Tutors Edition
                </div>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
