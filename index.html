<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cioal Tutors Scientific Calculator (fx-991ES PLUS)</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .cursor-blink {
            display: inline-block;
            width: 2px;
            height: 1.15em;
            background-color: #14532d;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
            margin-left: 1px;
            margin-right: 1px;
        }
        
        button {
            touch-action: manipulation;
            user-select: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Specialized Button Component with dual SHIFT (gold) and ALPHA (red) labels
        const CalculatorButton = ({ 
          label, 
          subShift = null,
          subAlpha = null,
          color = "bg-[#1a4023]", 
          textColor = "text-white", 
          onClick, 
          className = "", 
          shape = "rounded-md",
          textClass = "text-xs font-semibold",
          isActive = false,
          disabled = false
        }) => {
          return (
            <div className="relative flex flex-col items-center justify-end w-full h-[46px]">
              {/* Dual Sub-labels: SHIFT (gold on left) & ALPHA (red on right) */}
              <div className="w-full flex justify-between px-0.5 text-[8px] font-bold leading-none mb-1 h-3 items-end pointer-events-none">
                <span className="text-yellow-300 truncate tracking-tight">{subShift || ""}</span>
                <span className="text-red-400 truncate tracking-tight">{subAlpha || ""}</span>
              </div>
              
              <button
                type="button"
                disabled={disabled}
                onClick={onClick}
                className={`
                  ${isActive ? 'ring-2 ring-yellow-400 scale-[1.02]' : ''} 
                  ${color} ${textColor} ${shape} ${className}
                  shadow-[0_2px_0_rgba(0,0,0,0.35)] 
                  active:shadow-none active:translate-y-[2px] 
                  transition-all duration-75
                  flex items-center justify-center
                  w-full h-8
                  border-t border-white/15
                  hover:brightness-110
                  disabled:opacity-40 disabled:pointer-events-none
                `}
              >
                <span className={textClass}>{label}</span>
              </button>
            </div>
          );
        };

        // Scientific Constants lookup (Casio CONST)
        const CONSTANTS = [
            { code: "1", sym: "c", name: "Speed of light", val: 299792458 },
            { code: "2", sym: "h", name: "Planck constant", val: 6.62607015e-34 },
            { code: "3", sym: "G", name: "Gravitational const", val: 6.67430e-11 },
            { code: "4", sym: "g", name: "Standard gravity", val: 9.80665 },
            { code: "5", sym: "e", name: "Elementary charge", val: 1.602176634e-19 },
            { code: "6", sym: "me", name: "Electron mass", val: 9.1093837e-31 },
            { code: "7", sym: "mp", name: "Proton mass", val: 1.6726219e-27 },
            { code: "8", sym: "Na", name: "Avogadro const", val: 6.02214076e23 },
            { code: "9", sym: "R", name: "Molar gas const", val: 8.314462618 },
            { code: "0", sym: "k", name: "Boltzmann const", val: 1.380649e-23 }
        ];

        // Unit Conversions lookup (Casio CONV)
        const CONVERSIONS = [
            { code: "1", name: "km/h ➔ m/s", factor: 1 / 3.6 },
            { code: "2", name: "m/s ➔ km/h", factor: 3.6 },
            { code: "3", name: "in ➔ cm", factor: 2.54 },
            { code: "4", name: "cm ➔ in", factor: 1 / 2.54 },
            { code: "5", name: "ft ➔ m", factor: 0.3048 },
            { code: "6", name: "m ➔ ft", factor: 1 / 0.3048 },
            { code: "7", name: "lb ➔ kg", factor: 0.45359237 },
            { code: "8", name: "kg ➔ lb", factor: 1 / 0.45359237 },
            { code: "9", name: "°C ➔ °F", custom: (v) => (v * 9/5) + 32 },
            { code: "0", name: "cal ➔ J", factor: 4.184 }
        ];

        // Automatic Parenthesis / Bracket closer
        const autoCloseBrackets = (str) => {
            if (!str) return str;
            let openCount = 0;
            for (let i = 0; i < str.length; i++) {
                if (str[i] === '(') openCount++;
                else if (str[i] === ')') openCount = Math.max(0, openCount - 1);
            }
            return str + ')'.repeat(openCount);
        };

        // Convert Decimal to DMS string with full carryover handling
        const toDMS = (val) => {
            let num = parseFloat(val);
            if (isNaN(num)) return val;
            const sign = num < 0 ? '-' : '';
            num = parseFloat(Math.abs(num).toFixed(10));
            let deg = Math.floor(num);
            let remainderMin = parseFloat(((num - deg) * 60).toFixed(8));
            let min = Math.floor(remainderMin);
            let remainderSec = parseFloat(((remainderMin - min) * 60).toFixed(4));
            let sec = Math.round(remainderSec * 100) / 100;

            if (sec >= 60) {
                sec = 0;
                min += 1;
            }
            if (min >= 60) {
                min = 0;
                deg += 1;
            }
            return `${sign}${deg}°${min}'${sec}"`;
        };

        // Parse DMS tokens in mathematical expressions
        const parseDMS = (expr, angleMode = 'D') => {
            let exp = expr;

            // Pattern 1: D°M°S° or D°M'S"
            const dms3Regex = /(\d+(?:\.\d+)?)°\s*(\d+(?:\.\d+)?)(?:°|')\s*(\d+(?:\.\d+)?)(?:°|"|'')?/g;
            exp = exp.replace(dms3Regex, (match, d, m, s) => {
                const deg = parseFloat(d) || 0;
                const min = parseFloat(m) || 0;
                const sec = parseFloat(s) || 0;
                let totalDeg = deg + (min / 60) + (sec / 3600);
                if (angleMode === 'R') totalDeg = totalDeg * (Math.PI / 180);
                else if (angleMode === 'G') totalDeg = totalDeg * (200 / 180);
                return `(${totalDeg})`;
            });

            // Pattern 2: D°M° or D°M'
            const dms2Regex = /(\d+(?:\.\d+)?)°\s*(\d+(?:\.\d+)?)(?:°|')/g;
            exp = exp.replace(dms2Regex, (match, d, m) => {
                const deg = parseFloat(d) || 0;
                const min = parseFloat(m) || 0;
                let totalDeg = deg + (min / 60);
                if (angleMode === 'R') totalDeg = totalDeg * (Math.PI / 180);
                else if (angleMode === 'G') totalDeg = totalDeg * (200 / 180);
                return `(${totalDeg})`;
            });

            // Pattern 3: Standalone D°
            const dms1Regex = /(\d+(?:\.\d+)?)°/g;
            exp = exp.replace(dms1Regex, (match, d) => {
                let deg = parseFloat(d) || 0;
                if (angleMode === 'R') deg = deg * (Math.PI / 180);
                else if (angleMode === 'G') deg = deg * (200 / 180);
                return `(${deg})`;
            });

            return exp;
        };

        // Helper: Fraction / Radical / Pi / Mixed Fraction Converter for S<=>D
        const convertToSD = (currentResult, isMixed = false) => {
            if (!currentResult || currentResult === 'Error') return currentResult;

            // 1. If currently a fraction, mixed fraction, radical or DMS, revert to decimal
            if (typeof currentResult === 'string' && (currentResult.includes('/') || currentResult.includes('√') || currentResult.includes('π') || currentResult.includes('°'))) {
                 try {
                    // Check for DMS string e.g. 12°30'0" or 12°30°
                    if (currentResult.includes('°')) {
                        const parts = currentResult.split(/[°'"]/);
                        const deg = parseFloat(parts[0]) || 0;
                        const min = parseFloat(parts[1]) || 0;
                        const sec = parseFloat(parts[2]) || 0;
                        const sign = currentResult.trim().startsWith('-') ? -1 : 1;
                        const decVal = (Math.abs(deg) + min / 60 + sec / 3600) * sign;
                        return parseFloat(decVal.toPrecision(10)).toString();
                    }

                    // Check for mixed fraction e.g. "1 2/3"
                    if (currentResult.includes(' ') && currentResult.includes('/')) {
                        const isNeg = currentResult.trim().startsWith('-');
                        const clean = isNeg ? currentResult.replace('-', '') : currentResult;
                        const [whole, frac] = clean.split(' ');
                        const [num, den] = frac.split('/');
                        const val = (parseFloat(whole) + (parseFloat(num) / parseFloat(den))) * (isNeg ? -1 : 1);
                        return parseFloat(val.toPrecision(10)).toString();
                    }

                    let evalStr = currentResult
                        .replace(/√(\d+)/g, 'Math.sqrt($1)')
                        .replace(/π/g, 'Math.PI');
                    // eslint-disable-next-line no-new-func
                    const val = new Function('return ' + evalStr)();
                    return parseFloat(val.toPrecision(10)).toString();
                 } catch (e) {
                    return currentResult;
                 }
            }

            const val = parseFloat(currentResult);
            if (isNaN(val)) return currentResult;

            const tolerance = 1.0e-9;

            // 2. Check for PI factors
            const piRatio = val / Math.PI;
            if (Math.abs(piRatio - Math.round(piRatio)) < tolerance) {
                const n = Math.round(piRatio);
                if (n === 1) return 'π';
                if (n === -1) return '-π';
                if (n === 0) return '0';
                return `${n}π`;
            }

            // 3. Check for Square Roots
            const sq = val * val;
            if (Math.abs(Math.round(sq) - sq) < tolerance && val > 0) {
                const n = Math.round(sq);
                if (val % 1 !== 0) {
                     return `√${n}`;
                }
            }

            // 4. Continued Fraction for Rational Approximation
            let h1 = 1, h2 = 0, k1 = 0, k2 = 1;
            let b = Math.abs(val);
            let safety = 0;

            do {
                let a = Math.floor(b);
                let aux = h1; h1 = a * h1 + h2; h2 = aux;
                aux = k1; k1 = a * k1 + k2; k2 = aux;
                b = 1 / (b - a);
                safety++;
            } while (Math.abs(Math.abs(val) - h1 / k1) > Math.abs(val) * tolerance && safety < 25);

            if (k1 < 10000 && k1 !== 1) {
                const sign = val < 0 ? '-' : '';
                if (isMixed && h1 > k1) {
                    const whole = Math.floor(h1 / k1);
                    const remainder = h1 % k1;
                    return remainder === 0 ? `${sign}${whole}` : `${sign}${whole} ${remainder}/${k1}`;
                }
                return `${sign}${h1}/${k1}`;
            }

            return currentResult.toString();
        };

        // Render Result cleanly: Stacks fractions with horizontal bar (no slash!)
        const renderResultDisplay = (res) => {
            if (!res) return <span>0</span>;
            if (res === 'Error') return <span className="text-red-700">Error</span>;

            // 1. Mixed Fraction e.g. "1 2/3" or "-2 3/5"
            if (typeof res === 'string' && res.includes(' ') && res.includes('/')) {
                const isNeg = res.trim().startsWith('-');
                const clean = isNeg ? res.replace('-', '') : res;
                const [whole, frac] = clean.split(' ');
                if (frac && frac.includes('/')) {
                    const [num, den] = frac.split('/');
                    return (
                        <div className="inline-flex items-center justify-end font-mono leading-none">
                            {isNeg && <span className="text-2xl font-bold leading-none mr-1">-</span>}
                            <span className="text-2xl font-bold leading-none mr-1.5">{whole}</span>
                            <div className="inline-flex flex-col items-center justify-center leading-none">
                                <span className="text-xs font-bold px-1 leading-none">{num}</span>
                                <div className="w-full h-[1.5px] bg-[#14532d] my-[2px]"></div>
                                <span className="text-xs font-bold px-1 leading-none">{den}</span>
                            </div>
                        </div>
                    );
                }
            }

            // 2. Simple Fraction e.g. "1/2" or "-3/4" or "π/3" or "√3/2"
            if (typeof res === 'string' && res.includes('/') && !res.includes('°')) {
                const isNeg = res.trim().startsWith('-');
                const clean = isNeg ? res.replace('-', '') : res;
                const parts = clean.split('/');
                if (parts.length === 2) {
                    const [num, den] = parts;
                    return (
                        <div className="inline-flex items-center justify-end font-mono leading-none">
                            {isNeg && <span className="text-2xl font-bold leading-none mr-1">-</span>}
                            <div className="inline-flex flex-col items-center justify-center leading-none">
                                <span className="text-sm font-bold px-1 leading-none">{num}</span>
                                <div className="w-full h-[1.5px] bg-[#14532d] my-[2px]"></div>
                                <span className="text-sm font-bold px-1 leading-none">{den}</span>
                            </div>
                        </div>
                    );
                }
            }

            // 3. Normal string or number (DMS e.g. 12°30'15", decimal 0.5, etc.)
            return <span>{res}</span>;
        };

        function App() {
          const [isOff, setIsOff] = useState(false);
          const [expression, setExpression] = useState('');
          const [cursorPos, setCursorPos] = useState(0);
          const [result, setResult] = useState('');
          const [isResultMode, setIsResultMode] = useState(false); // True when a calculated result is showing
          const [history, setHistory] = useState([]);
          const [historyIdx, setHistoryIdx] = useState(-1);
          
          // State Registers for Casio fx-991ES
          const [variables, setVariables] = useState({
              A: 0, B: 0, C: 0, D: 0, E: 0, F: 0, X: 0, Y: 0, M: 0
          });
          const [ansValue, setAnsValue] = useState(0);
          const [ansDisplay, setAnsDisplay] = useState('0');

          // Settings State
          const [angleMode, setAngleMode] = useState('D'); // D (Deg), R (Rad), G (Gra)
          const [displayFormat, setDisplayFormat] = useState('Norm'); // Norm, Fix, Sci
          const [calcMode, setCalcMode] = useState('COMP'); // COMP, CMPLX, STAT, etc.

          // Modifier Modes
          const [isShift, setIsShift] = useState(false);
          const [isAlpha, setIsAlpha] = useState(false);
          const [stoActive, setStoActive] = useState(false);
          const [rclActive, setRclActive] = useState(false);

          // Active LCD Menu: null, 'MODE', 'SETUP', 'HYP', 'CONST', 'CONV', 'CLR', 'DRG', 'CALC_INPUT'
          const [activeMenu, setActiveMenu] = useState(null);
          const [calcVarInput, setCalcVarInput] = useState({ varName: 'X', value: '' });

          const scrollRef = useRef(null);
          const cursorRef = useRef(null);

          // Auto-scroll display to cursor position
          useEffect(() => {
            if (cursorRef.current && scrollRef.current) {
               if (cursorPos === expression.length) {
                   scrollRef.current.scrollLeft = scrollRef.current.scrollWidth;
               } else {
                   cursorRef.current.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
               }
            }
          }, [expression, cursorPos]);

          // Power On / Reset
          const handlePowerOn = () => {
            if (isOff) {
                setIsOff(false);
            }
            setExpression('');
            setCursorPos(0);
            setResult('');
            setIsResultMode(false);
            setIsShift(false);
            setIsAlpha(false);
            setStoActive(false);
            setRclActive(false);
            setActiveMenu(null);
          };

          // Power Off (SHIFT + AC)
          const handlePowerOff = () => {
              setIsOff(true);
              setIsShift(false);
              setIsAlpha(false);
              setStoActive(false);
              setRclActive(false);
              setActiveMenu(null);
          };

          // Character Insertion at Cursor with Robust Result State Machine
          const insert = (val) => {
            if (isOff) return;

            if (activeMenu) {
                handleMenuSelect(val);
                return;
            }

            // When a calculation result is currently showing:
            if (isResultMode) {
                setIsResultMode(false);
                if (['+', '-', '×', '÷', '^', 'P', 'C'].includes(val)) {
                    // Operator chain: begins calculation with previous answer: Ans + ...
                    const newExp = 'Ans' + val;
                    setExpression(newExp);
                    setCursorPos(newExp.length);
                    // keep previous answer visible on display!
                    setResult(ansDisplay || ansValue.toString());
                    setIsShift(false);
                    setIsAlpha(false);
                    return;
                } else if (val === 'Ans') {
                    // Ans button pressed after calculation: sets expression to Ans and keeps answer visible!
                    setExpression('Ans');
                    setCursorPos(3);
                    setResult(ansDisplay || ansValue.toString());
                    setIsShift(false);
                    setIsAlpha(false);
                    return;
                } else {
                    // User starts typing a fresh new number or function:
                    setExpression(val);
                    setCursorPos(val.length);
                    setResult('');
                    setIsShift(false);
                    setIsAlpha(false);
                    return;
                }
            }

            // Special case: Ans pressed when not in result mode
            if (val === 'Ans') {
                const newExp = expression.slice(0, cursorPos) + 'Ans' + expression.slice(cursorPos);
                setExpression(newExp);
                setCursorPos(prev => prev + 3);
                if (!expression) {
                    setResult(ansDisplay || '0');
                }
                setIsShift(false);
                setIsAlpha(false);
                return;
            }

            const newExp = expression.slice(0, cursorPos) + val + expression.slice(cursorPos);
            setExpression(newExp);
            setCursorPos(prev => prev + val.length);
            
            setIsShift(false);
            setIsAlpha(false);
          };

          const deleteChar = () => {
            if (isOff || activeMenu) return;
            if (isResultMode) {
                setIsResultMode(false);
            }
            if (cursorPos > 0) {
                // If deleting 'Ans' (3 chars)
                if (expression.slice(cursorPos - 3, cursorPos) === 'Ans') {
                    const newExp = expression.slice(0, cursorPos - 3) + expression.slice(cursorPos);
                    setExpression(newExp);
                    setCursorPos(prev => prev - 3);
                } else {
                    const newExp = expression.slice(0, cursorPos - 1) + expression.slice(cursorPos);
                    setExpression(newExp);
                    setCursorPos(prev => prev - 1);
                }
            }
          };

          const clearAll = () => {
            if (isOff) return;
            setExpression('');
            setCursorPos(0);
            setResult('');
            setIsResultMode(false);
            setIsShift(false);
            setIsAlpha(false);
            setStoActive(false);
            setRclActive(false);
            setActiveMenu(null);
            // Note: ansValue and ansDisplay are preserved across AC, matching Casio fx-991ES!
          };

          // Cursor Navigation
          const moveCursorLeft = () => {
              if (isOff) return;
              if (isResultMode) setIsResultMode(false);
              setCursorPos(prev => Math.max(0, prev - 1));
          };
          const moveCursorRight = () => {
              if (isOff) return;
              if (isResultMode) setIsResultMode(false);
              setCursorPos(prev => Math.min(expression.length, prev + 1));
          };

          // History Navigation (REPLAY Up / Down)
          const navigateHistoryUp = () => {
              if (isOff || history.length === 0) return;
              const nextIdx = historyIdx < history.length - 1 ? historyIdx + 1 : historyIdx;
              setHistoryIdx(nextIdx);
              setExpression(history[nextIdx].expression);
              setCursorPos(history[nextIdx].expression.length);
              setResult(history[nextIdx].result);
              setIsResultMode(true);
          };

          const navigateHistoryDown = () => {
              if (isOff || history.length === 0) return;
              if (historyIdx > 0) {
                  const nextIdx = historyIdx - 1;
                  setHistoryIdx(nextIdx);
                  setExpression(history[nextIdx].expression);
                  setCursorPos(history[nextIdx].expression.length);
                  setResult(history[nextIdx].result);
                  setIsResultMode(true);
              } else if (historyIdx === 0) {
                  setHistoryIdx(-1);
                  setExpression('');
                  setCursorPos(0);
                  setResult('');
                  setIsResultMode(false);
              }
          };

          // Standard to Decimal S<=>D (Toggles Decimal <-> Stacked Fraction)
          const handleSD = (isMixed = false) => {
              if (isOff || !result || result === 'Error') return;
              const newRes = convertToSD(result, isMixed);
              setResult(newRes);
              setAnsDisplay(newRes);
          };

          // Degrees / Minutes / Seconds Conversion (DMS Key)
          const handleDMS = () => {
              if (isOff) return;
              if (result && result !== 'Error') {
                  if (result.includes('°')) {
                      // Already DMS: toggle to decimal degrees
                      const dec = convertToSD(result);
                      setResult(dec);
                      setAnsDisplay(dec);
                  } else {
                      // Decimal: convert to DMS
                      const dms = toDMS(result);
                      setResult(dms);
                      setAnsDisplay(dms);
                  }
              } else {
                  insert('°');
              }
          };

          // Engineering Notation (ENG)
          const handleENG = (isReverse = false) => {
              if (isOff || !result || result === 'Error') return;
              const num = parseFloat(result);
              if (isNaN(num) || num === 0) return;

              let exp = Math.floor(Math.log10(Math.abs(num)));
              let engExp = Math.floor(exp / 3) * 3;
              if (isReverse) engExp += 3;
              const mantissa = num / Math.pow(10, engExp);
              const formatted = `${parseFloat(mantissa.toPrecision(7))}×10^${engExp}`;
              setResult(formatted);
              setAnsDisplay(formatted);
          };

          // Variable Store (STO) & Recall (RCL)
          const handleVariableKey = (varName) => {
              if (stoActive) {
                  const val = ansValue;
                  setVariables(prev => ({ ...prev, [varName]: val }));
                  setResult(`${val} ➔ ${varName}`);
                  setStoActive(false);
              } else if (rclActive) {
                  const val = variables[varName] !== undefined ? variables[varName] : 0;
                  insert(val.toString());
                  setRclActive(false);
              } else if (isAlpha) {
                  insert(varName);
                  setIsAlpha(false);
              }
          };

          // Memory M+ / M-
          const handleMemoryAdd = (subtract = false) => {
              if (isOff) return;
              try {
                  const val = ansValue;
                  const multiplier = subtract ? -1 : 1;
                  const newM = variables.M + (val * multiplier);
                  setVariables(prev => ({ ...prev, M: newM }));
                  setResult(`M = ${newM}`);
                  setIsShift(false);
              } catch (e) {
                  setResult('Error');
              }
          };

          // Evaluate Single Variable Expression Helper (for calculus & solvers)
          const evalSingleVar = (expr, varName, xVal) => {
              let parsed = expr;
              
              // Implicit Multiplication for single var
              parsed = parsed.replace(new RegExp(`(\\d)(${varName})`, 'g'), `$1*${varName}`);
              parsed = parsed.replace(new RegExp(`(${varName})(\\d)`, 'g'), `${varName}*$1`);
              parsed = parsed.replace(new RegExp(`(\\))(${varName})`, 'g'), `$1*${varName}`);
              parsed = parsed.replace(new RegExp(`(${varName})(\\()`, 'g'), `${varName}*$1`);

              // Substitute varName safely
              parsed = parsed.replace(new RegExp(`\\b${varName}\\b`, 'g'), `(${xVal})`);
              parsed = autoCloseBrackets(parsed);
              return evaluateMath(parsed, false);
          };

          // Core Mathematical Evaluator for Casio fx-991ES
          const evaluateMath = (mathStr, formatResult = true) => {
              if (!mathStr || !mathStr.trim()) return 0;

              // Ensure all opened parentheses are properly closed
              let exp = autoCloseBrackets(mathStr);

              // 1. Substitute variables (except in calculus expressions)
              for (const [vKey, vVal] of Object.entries(variables)) {
                  if (vKey !== 'X') {
                      exp = exp.replace(new RegExp(`\\b${vKey}\\b`, 'g'), `(${vVal})`);
                  }
              }

              // 2. Implicit Multiplications with Ans & replace Ans with numeric ansValue
              exp = exp
                  .replace(/(\d)Ans/g, '$1*Ans')
                  .replace(/Ans(\d)/g, 'Ans*$1')
                  .replace(/(\))Ans/g, '$1*Ans')
                  .replace(/Ans\(/g, 'Ans*(')
                  .replace(/AnsAns/g, 'Ans*Ans');

              exp = exp.replace(/\bAns\b/g, `(${ansValue})`);

              // 3. Numerical Integration: ∫(expr, a, b)
              const integralRegex = /∫\(([^,]+),([^,]+),([^)]+)\)/;
              let matchInt = exp.match(integralRegex);
              let intSafety = 0;
              while (matchInt && intSafety < 5) {
                  const subExpr = matchInt[1];
                  const aVal = evaluateMath(matchInt[2], false);
                  const bVal = evaluateMath(matchInt[3], false);
                  
                  // Adaptive Simpson's Rule (100 sub-intervals)
                  const n = 100;
                  const h = (bVal - aVal) / n;
                  let sum = evalSingleVar(subExpr, 'X', aVal) + evalSingleVar(subExpr, 'X', bVal);
                  for (let i = 1; i < n; i++) {
                      const curX = aVal + i * h;
                      sum += (i % 2 === 0 ? 2 : 4) * evalSingleVar(subExpr, 'X', curX);
                  }
                  const intResult = (h / 3) * sum;
                  exp = exp.replace(matchInt[0], `(${intResult})`);
                  matchInt = exp.match(integralRegex);
                  intSafety++;
              }

              // 4. Numerical Differentiation: d/dx(expr, a)
              const diffRegex = /d\/dx\(([^,]+),([^)]+)\)/;
              let matchDiff = exp.match(diffRegex);
              let diffSafety = 0;
              while (matchDiff && diffSafety < 5) {
                  const subExpr = matchDiff[1];
                  const aVal = evaluateMath(matchDiff[2], false);
                  const h = 1e-6;
                  const fPlus = evalSingleVar(subExpr, 'X', aVal + h);
                  const fMinus = evalSingleVar(subExpr, 'X', aVal - h);
                  const diffRes = (fPlus - fMinus) / (2 * h);
                  exp = exp.replace(matchDiff[0], `(${diffRes})`);
                  matchDiff = exp.match(diffRegex);
                  diffSafety++;
              }

              // 5. Summation: Σ(expr, start, end)
              const sumRegex = /Σ\(([^,]+),([^,]+),([^)]+)\)/;
              let matchSum = exp.match(sumRegex);
              let sumSafety = 0;
              while (matchSum && sumSafety < 5) {
                  const subExpr = matchSum[1];
                  const startVal = Math.round(evaluateMath(matchSum[2], false));
                  const endVal = Math.round(evaluateMath(matchSum[3], false));
                  let total = 0;
                  for (let curX = startVal; curX <= endVal; curX++) {
                      total += evalSingleVar(subExpr, 'X', curX);
                  }
                  exp = exp.replace(matchSum[0], `(${total})`);
                  matchSum = exp.match(sumRegex);
                  sumSafety++;
              }

              // 6. Pol(x, y) and Rec(r, θ)
              const polRegex = /Pol\(([^,]+),([^)]+)\)/;
              const matchPol = exp.match(polRegex);
              if (matchPol) {
                  const px = evaluateMath(matchPol[1], false);
                  const py = evaluateMath(matchPol[2], false);
                  const r = Math.sqrt(px * px + py * py);
                  let theta = Math.atan2(py, px);
                  if (angleMode === 'D') theta = theta * (180 / Math.PI);
                  else if (angleMode === 'G') theta = theta * (200 / Math.PI);
                  setVariables(prev => ({ ...prev, X: r, Y: theta }));
                  return `r=${parseFloat(r.toPrecision(8))}, θ=${parseFloat(theta.toPrecision(8))}`;
              }

              const recRegex = /Rec\(([^,]+),([^)]+)\)/;
              const matchRec = exp.match(recRegex);
              if (matchRec) {
                  const rr = evaluateMath(matchRec[1], false);
                  let th = evaluateMath(matchRec[2], false);
                  let rad = th;
                  if (angleMode === 'D') rad = th * (Math.PI / 180);
                  else if (angleMode === 'G') rad = th * (Math.PI / 200);
                  const rx = rr * Math.cos(rad);
                  const ry = rr * Math.sin(rad);
                  setVariables(prev => ({ ...prev, X: rx, Y: ry }));
                  return `x=${parseFloat(rx.toPrecision(8))}, y=${parseFloat(ry.toPrecision(8))}`;
              }

              // 7. Base-N Log: log_b(base, val)
              const logBaseRegex = /log_b\(([^,]+),([^)]+)\)/;
              let matchLogB = exp.match(logBaseRegex);
              while (matchLogB) {
                  const base = evaluateMath(matchLogB[1], false);
                  const val = evaluateMath(matchLogB[2], false);
                  const res = Math.log(val) / Math.log(base);
                  exp = exp.replace(matchLogB[0], `(${res})`);
                  matchLogB = exp.match(logBaseRegex);
              }

              // 8. Factorial & Permutation/Combination
              const factLib = `
                function fact(n) {
                  if (n < 0 || Math.floor(n) !== n) return NaN;
                  if (n === 0 || n === 1) return 1;
                  let r = 1; for (let i = 2; i <= n; i++) r *= i;
                  return r;
                }
                function nPr(n, r) {
                  if (n < 0 || r < 0 || r > n) return NaN;
                  return fact(n) / fact(n - r);
                }
                function nCr(n, r) {
                  if (n < 0 || r < 0 || r > n) return NaN;
                  return fact(n) / (fact(r) * fact(n - r));
                }
                function RanInt(a, b) {
                  return Math.floor(Math.random() * (b - a + 1)) + a;
                }
              `;

              // Replace Factorials (e.g. 5!)
              exp = exp.replace(/(\d+)!/g, 'fact($1)');
              exp = exp.replace(/\(([^)]+)\)!/g, 'fact($1)');

              // Replace nPr and nCr
              const atom = "((?:\\d+(?:\\.\\d+)?)|(?:\\([^)]+\\)))";
              exp = exp.replace(new RegExp(`${atom}P${atom}`, 'g'), 'nPr($1, $2)');
              exp = exp.replace(new RegExp(`${atom}C${atom}`, 'g'), 'nCr($1, $2)');

              // 9. Robust DMS Parsing
              exp = parseDMS(exp, angleMode);

              // 10. Implicit Multiplications (e.g. 2(3), 2π, 2sin(30))
              exp = exp
                .replace(/(\d)(\()/g, '$1*$2')
                .replace(/(\))(\d)/g, '$1*$2')
                .replace(/(\))(\()/g, '$1*$2')
                .replace(/(\d)(π|e)/g, '$1*$2')
                .replace(/(π|e)(\d)/g, '$1*$2')
                .replace(/(\d)(sin|cos|tan|log|ln|√)/g, '$1*$2');

              // If X is still in exp, substitute with variables.X
              exp = exp.replace(/\bX\b/g, `(${variables.X || 0})`);

              // 11. Standard Math Replacements
              exp = exp
                .replace(/×/g, '*')
                .replace(/÷/g, '/')
                .replace(/π/g, 'Math.PI')
                .replace(/\be\b/g, 'Math.E')
                .replace(/\^/g, '**')
                .replace(/³√\(/g, 'Math.cbrt(')
                .replace(/√\(/g, 'Math.sqrt(')
                .replace(/√(\d+)/g, 'Math.sqrt($1)')
                .replace(/Ran#/g, '(Math.floor(Math.random()*1000)/1000)')
                .replace(/RanInt#\(/g, 'RanInt(');

              // 12. Hyperbolic functions
              exp = exp
                .replace(/asinh\(/g, 'Math.asinh(')
                .replace(/acosh\(/g, 'Math.acosh(')
                .replace(/atanh\(/g, 'Math.atanh(')
                .replace(/sinh\(/g, 'Math.sinh(')
                .replace(/cosh\(/g, 'Math.cosh(')
                .replace(/tanh\(/g, 'Math.tanh(');

              // 13. Logarithms
              exp = exp
                .replace(/log\(/g, 'Math.log10(')
                .replace(/ln\(/g, 'Math.log(');

              // 14. Trigonometry Angle Modes
              exp = exp.replace(/asin\(/g, 'TR_ASIN(');
              exp = exp.replace(/acos\(/g, 'TR_ACOS(');
              exp = exp.replace(/atan\(/g, 'TR_ATAN(');

              if (angleMode === 'D') {
                  exp = exp
                    .replace(/sin\(/g, 'Math.sin((Math.PI/180)*')
                    .replace(/cos\(/g, 'Math.cos((Math.PI/180)*')
                    .replace(/tan\(/g, 'Math.tan((Math.PI/180)*')
                    .replace(/TR_ASIN\(/g, '(180/Math.PI)*Math.asin(')
                    .replace(/TR_ACOS\(/g, '(180/Math.PI)*Math.acos(')
                    .replace(/TR_ATAN\(/g, '(180/Math.PI)*Math.atan(');
              } else if (angleMode === 'G') {
                  exp = exp
                    .replace(/sin\(/g, 'Math.sin((Math.PI/200)*')
                    .replace(/cos\(/g, 'Math.cos((Math.PI/200)*')
                    .replace(/tan\(/g, 'Math.tan((Math.PI/200)*')
                    .replace(/TR_ASIN\(/g, '(200/Math.PI)*Math.asin(')
                    .replace(/TR_ACOS\(/g, '(200/Math.PI)*Math.acos(')
                    .replace(/TR_ATAN\(/g, '(200/Math.PI)*Math.atan(');
              } else {
                  exp = exp
                    .replace(/sin\(/g, 'Math.sin(')
                    .replace(/cos\(/g, 'Math.cos(')
                    .replace(/tan\(/g, 'Math.tan(')
                    .replace(/TR_ASIN\(/g, 'Math.asin(')
                    .replace(/TR_ACOS\(/g, 'Math.acos(')
                    .replace(/TR_ATAN\(/g, 'Math.atan(');
              }

              // Final check for balanced parentheses
              exp = autoCloseBrackets(exp);

              // Evaluate safely
              // eslint-disable-next-line no-new-func
              const calcFn = new Function(factLib + 'return ' + exp);
              const res = calcFn();

              if (!formatResult) return res;

              if (typeof res === 'string') return res;
              if (isNaN(res) || !isFinite(res)) return 'Error';

              // BY DEFAULT: DISPLAY AS DECIMAL (NOT FRACTION)
              // User can press S<=>D anytime to convert to stacked fraction!
              let outStr = '';
              if (displayFormat === 'Fix') {
                  outStr = res.toFixed(4);
              } else if (displayFormat === 'Sci') {
                  outStr = res.toExponential(4);
              } else {
                  outStr = parseFloat(res.toPrecision(10)).toString();
              }

              return outStr;
          };

          // Main Equal (=) Evaluator
          const handleEvaluate = () => {
              if (isOff || !expression) return;

              // Auto-close any unclosed brackets (e.g. tan⁻¹(1 -> tan⁻¹(1))
              const cleanExp = autoCloseBrackets(expression);
              if (cleanExp !== expression) {
                  setExpression(cleanExp);
                  setCursorPos(cleanExp.length);
              }

              const hasDMS = cleanExp.includes('°');

              // Check if Equation solving with '=' is requested
              if (cleanExp.includes('=')) {
                  handleSolve(cleanExp);
                  return;
              }

              // Handle multi-statement expressions with ':'
              if (cleanExp.includes(':')) {
                  const statements = cleanExp.split(':');
                  let lastRes = '';
                  let lastRaw = 0;
                  for (const stmt of statements) {
                      if (stmt.trim()) {
                          lastRaw = evaluateMath(stmt, false);
                          lastRes = evaluateMath(stmt, true);
                      }
                  }
                  if (hasDMS && lastRes !== 'Error' && !isNaN(parseFloat(lastRes))) {
                      lastRes = toDMS(lastRes);
                  }
                  setResult(lastRes);
                  setIsResultMode(true);
                  if (lastRes !== 'Error') {
                      if (typeof lastRaw === 'number' && !isNaN(lastRaw) && isFinite(lastRaw)) {
                          setAnsValue(lastRaw);
                      }
                      setAnsDisplay(lastRes);
                      setHistory(prev => [{ expression: cleanExp, result: lastRes }, ...prev]);
                      setHistoryIdx(-1);
                  }
                  return;
              }

              try {
                  const rawVal = evaluateMath(cleanExp, false);
                  let finalRes = evaluateMath(cleanExp, true);
                  if (hasDMS && finalRes !== 'Error' && !isNaN(parseFloat(finalRes))) {
                      finalRes = toDMS(finalRes);
                  }
                  setResult(finalRes);
                  setIsResultMode(true);
                  if (finalRes !== 'Error') {
                      if (typeof rawVal === 'number' && !isNaN(rawVal) && isFinite(rawVal)) {
                          setAnsValue(rawVal);
                      }
                      setAnsDisplay(finalRes);
                      setHistory(prev => [{ expression: cleanExp, result: finalRes }, ...prev]);
                      setHistoryIdx(-1);
                  }
              } catch (e) {
                  setResult('Error');
                  setIsResultMode(true);
              }
              setIsShift(false);
              setIsAlpha(false);
          };

          // Numerical Equation Solver (SOLVE)
          const handleSolve = (exprToSolve) => {
              if (isOff) return;
              try {
                  const targetExp = autoCloseBrackets(exprToSolve || expression);
                  const parts = targetExp.split('=');
                  const leftExp = parts[0];
                  const rightExp = parts[1] || '0';

                  // Newton-Raphson Solver
                  let x = variables.X || 1.0;
                  const tol = 1e-7;
                  let iter = 0;
                  let diff = 1;

                  while (Math.abs(diff) > tol && iter < 100) {
                      const fX = evalSingleVar(leftExp, 'X', x) - evalSingleVar(rightExp, 'X', x);
                      const h = 1e-5;
                      const fPrime = (
                          (evalSingleVar(leftExp, 'X', x + h) - evalSingleVar(rightExp, 'X', x + h)) -
                          (evalSingleVar(leftExp, 'X', x - h) - evalSingleVar(rightExp, 'X', x - h))
                      ) / (2 * h);

                      if (Math.abs(fPrime) < 1e-12) {
                          x += 0.1;
                          iter++;
                          continue;
                      }

                      diff = fX / fPrime;
                      x -= diff;
                      iter++;
                  }

                  const rootVal = parseFloat(x.toPrecision(8));
                  const leftVal = evalSingleVar(leftExp, 'X', rootVal);
                  const rightVal = evalSingleVar(rightExp, 'X', rootVal);
                  const residual = parseFloat((leftVal - rightVal).toPrecision(4));

                  setVariables(prev => ({ ...prev, X: rootVal }));
                  setAnsValue(rootVal);
                  const solveStr = `X=${rootVal} (L-R=${residual})`;
                  setResult(solveStr);
                  setAnsDisplay(rootVal.toString());
                  setIsResultMode(true);
              } catch (e) {
                  setResult('Error');
                  setIsResultMode(true);
              }
              setIsShift(false);
          };

          // CALC Key: Prompts or Evaluates Variable X
          const handleCalcKey = () => {
              if (isOff) return;
              if (isShift) {
                  handleSolve();
              } else if (expression.includes('X')) {
                  setActiveMenu('CALC_INPUT');
                  setCalcVarInput({ varName: 'X', value: variables.X.toString() });
              } else {
                  handleEvaluate();
              }
          };

          // Menu Selection Handler
          const handleMenuSelect = (choice) => {
              if (activeMenu === 'MODE') {
                  switch(choice) {
                      case '1': setCalcMode('COMP'); break;
                      case '2': setCalcMode('CMPLX'); break;
                      case '3': setCalcMode('STAT'); break;
                      case '4': setCalcMode('BASE-N'); break;
                      case '5': setCalcMode('EQN'); break;
                      case '6': setCalcMode('MATRIX'); break;
                      case '7': setCalcMode('TABLE'); break;
                      case '8': setCalcMode('VECTOR'); break;
                      default: break;
                  }
                  setActiveMenu(null);
              } else if (activeMenu === 'SETUP') {
                  switch(choice) {
                      case '1': break; // MthIO
                      case '2': break; // LineIO
                      case '3': setAngleMode('D'); break;
                      case '4': setAngleMode('R'); break;
                      case '5': setAngleMode('G'); break;
                      case '6': setDisplayFormat('Fix'); break;
                      case '7': setDisplayFormat('Sci'); break;
                      case '8': setDisplayFormat('Norm'); break;
                      default: break;
                  }
                  setActiveMenu(null);
              } else if (activeMenu === 'HYP') {
                  switch(choice) {
                      case '1': insert('sinh('); break;
                      case '2': insert('cosh('); break;
                      case '3': insert('tanh('); break;
                      case '4': insert('asinh('); break;
                      case '5': insert('acosh('); break;
                      case '6': insert('atanh('); break;
                      default: break;
                  }
                  setActiveMenu(null);
              } else if (activeMenu === 'CONST') {
                  const cObj = CONSTANTS.find(c => c.code === choice);
                  if (cObj) {
                      insert(cObj.val.toString());
                  }
                  setActiveMenu(null);
              } else if (activeMenu === 'CONV') {
                  const convObj = CONVERSIONS.find(c => c.code === choice);
                  if (convObj) {
                      if (convObj.custom && result && !isNaN(parseFloat(result))) {
                          const convRes = convObj.custom(parseFloat(result)).toString();
                          setResult(convRes);
                          setAnsDisplay(convRes);
                          setAnsValue(parseFloat(convRes) || 0);
                      } else if (convObj.factor) {
                          insert(`*${convObj.factor}`);
                      }
                  }
                  setActiveMenu(null);
              } else if (activeMenu === 'CLR') {
                  if (choice === '1') {
                      setAngleMode('D');
                      setDisplayFormat('Norm');
                      setCalcMode('COMP');
                      setResult('Reset Setup');
                  } else if (choice === '2') {
                      setVariables({ A: 0, B: 0, C: 0, D: 0, E: 0, F: 0, X: 0, Y: 0, M: 0 });
                      setAnsValue(0);
                      setAnsDisplay('0');
                      setResult('Reset Memory');
                  } else if (choice === '3') {
                      setAngleMode('D');
                      setDisplayFormat('Norm');
                      setCalcMode('COMP');
                      setVariables({ A: 0, B: 0, C: 0, D: 0, E: 0, F: 0, X: 0, Y: 0, M: 0 });
                      setAnsValue(0);
                      setAnsDisplay('0');
                      setExpression('');
                      setResult('Reset All');
                  }
                  setActiveMenu(null);
              } else if (activeMenu === 'DRG') {
                  if (result && !isNaN(parseFloat(result))) {
                      const val = parseFloat(result);
                      let newAng = val;
                      if (choice === '1') {
                          if (angleMode === 'R') newAng = val * 180 / Math.PI;
                          if (angleMode === 'G') newAng = val * 180 / 200;
                      } else if (choice === '2') {
                          if (angleMode === 'D') newAng = val * Math.PI / 180;
                          if (angleMode === 'G') newAng = val * Math.PI / 200;
                      } else if (choice === '3') {
                          if (angleMode === 'D') newAng = val * 200 / 180;
                          if (angleMode === 'R') newAng = val * 200 / Math.PI;
                      }
                      setResult(newAng.toString());
                      setAnsDisplay(newAng.toString());
                      setAnsValue(newAng);
                  }
                  setActiveMenu(null);
              }
          };

          return (
            <div className="min-h-screen bg-gradient-to-br from-[#1a4023] via-[#365E32] to-[#7AC143] flex items-center justify-center p-2 font-sans select-none">
              
              {/* Calculator Body Chassis */}
              <div className="relative w-[390px] bg-slate-900 rounded-[44px] shadow-[0_25px_60px_rgba(0,0,0,0.8),inset_0_-4px_8px_rgba(0,0,0,0.6)] overflow-hidden border-4 border-[#7AC143] flex flex-col p-4 pb-5">
                
                {/* --- Top Section: Branding & Solar Cell --- */}
                <div className="px-2 pt-1 pb-2 flex justify-between items-start relative z-10">
                  <div>
                    <div className="font-extrabold text-white text-base tracking-wider drop-shadow-sm flex items-center gap-1.5">
                      <span>CASIO</span>
                      <span className="text-xs font-semibold text-slate-300">fx-991ES PLUS</span>
                    </div>
                    <div className="text-[#7AC143] text-[11px] font-bold italic tracking-wide">
                      NATURAL-V.P.A.M.
                    </div>
                    <div className="text-[#d9f99d] text-[9px] font-semibold mt-0.5">
                      Cioal Tutors: <span className="text-yellow-400 font-bold">+923459069492</span>
                    </div>
                  </div>

                  <div className="flex flex-col items-end">
                     {/* Solar Cell Grid */}
                     <div className="w-18 h-7 bg-[#231b12] rounded border border-[#7AC143]/40 shadow-inner flex overflow-hidden p-0.5 gap-0.5">
                        <div className="flex-1 bg-[#422e1b] rounded-sm opacity-90 border-r border-[#7AC143]/20"></div>
                        <div className="flex-1 bg-[#422e1b] rounded-sm opacity-90 border-r border-[#7AC143]/20"></div>
                        <div className="flex-1 bg-[#422e1b] rounded-sm opacity-90 border-r border-[#7AC143]/20"></div>
                        <div className="flex-1 bg-[#422e1b] rounded-sm opacity-90"></div>
                     </div>
                     <div className="text-[7px] text-[#bef264] font-bold mt-1 tracking-widest uppercase">Two Way Power</div>
                  </div>
                </div>

                {/* --- LCD Natural Display Container --- */}
                <div className={`mx-1 mb-2.5 p-3 rounded-xl border-2 border-[#7AC143] shadow-[inset_0_2px_10px_rgba(0,0,0,0.25)] h-32 flex flex-col relative font-mono transition-colors duration-200 ${isOff ? 'bg-[#182618] border-green-900/50' : 'bg-[#eef8dd]'}`}>
                    
                    {isOff ? (
                      <div className="w-full h-full flex items-center justify-center text-green-900/30 text-xs font-bold tracking-widest">
                        POWER OFF
                      </div>
                    ) : (
                      <>
                        {/* 1. Casio LCD Status Indicators Bar */}
                        <div className="flex justify-between text-[9px] text-[#14532d] font-bold opacity-85 border-b border-[#14532d]/15 pb-0.5 leading-none">
                            <div className="flex gap-1.5 items-center">
                                <span className={isShift ? "text-slate-900 bg-yellow-400 px-1 rounded-sm" : "opacity-0"}>S</span>
                                <span className={isAlpha ? "text-white bg-red-500 px-1 rounded-sm" : "opacity-0"}>A</span>
                                <span className={variables.M !== 0 ? "text-black bg-black/10 px-1 rounded-sm" : "opacity-0"}>M</span>
                                <span className={stoActive ? "text-black bg-yellow-300 px-1 rounded-sm" : "opacity-0"}>STO</span>
                                <span className={rclActive ? "text-black bg-yellow-300 px-1 rounded-sm" : "opacity-0"}>RCL</span>
                                
                                <span className="text-black font-extrabold px-1 bg-black/5 rounded-sm">{angleMode}</span>
                                {displayFormat !== 'Norm' && <span className="text-black bg-black/5 px-1 rounded-sm">{displayFormat}</span>}
                            </div>
                            
                            <div className="flex gap-1.5 items-center">
                               {calcMode !== 'COMP' && <span className="text-black bg-black/5 px-1 rounded-sm">{calcMode}</span>}
                               <span className="text-[#14532d] text-[8px] font-bold">Math</span>
                               <span className="text-[7px] text-[#14532d]">{history.length > 0 ? "▲▼" : ""}</span>
                            </div>
                        </div>

                        {/* 2. Interactive Menu Overlays inside LCD Screen */}
                        {activeMenu === 'MODE' ? (
                            <div className="absolute inset-x-2 top-6 bottom-1 bg-[#eef8dd] z-20 text-[#14532d] text-[10px] font-bold grid grid-cols-2 gap-x-2 gap-y-0.5 content-start p-1">
                                <div>1: COMP</div> <div>2: CMPLX</div>
                                <div>3: STAT</div> <div>4: BASE-N</div>
                                <div>5: EQN</div>  <div>6: MATRIX</div>
                                <div>7: TABLE</div><div>8: VECTOR</div>
                            </div>
                        ) : activeMenu === 'SETUP' ? (
                            <div className="absolute inset-x-2 top-6 bottom-1 bg-[#eef8dd] z-20 text-[#14532d] text-[10px] font-bold grid grid-cols-2 gap-x-2 gap-y-0.5 content-start p-1">
                                <div>1: MthIO</div> <div>2: LineIO</div>
                                <div>3: Deg</div>   <div>4: Rad</div>
                                <div>5: Gra</div>   <div>6: Fix</div>
                                <div>7: Sci</div>   <div>8: Norm</div>
                            </div>
                        ) : activeMenu === 'HYP' ? (
                            <div className="absolute inset-x-2 top-6 bottom-1 bg-[#eef8dd] z-20 text-[#14532d] text-[10px] font-bold grid grid-cols-2 gap-x-2 gap-y-0.5 content-start p-1">
                                <div>1: sinh</div>  <div>2: cosh</div>
                                <div>3: tanh</div>  <div>4: sinh⁻¹</div>
                                <div>5: cosh⁻¹</div><div>6: tanh⁻¹</div>
                            </div>
                        ) : activeMenu === 'CONST' ? (
                            <div className="absolute inset-x-2 top-6 bottom-1 bg-[#eef8dd] z-20 text-[#14532d] text-[9px] font-bold p-1">
                                <div className="text-[8px] border-b border-[#14532d]/20 pb-0.5 mb-1">CONST: Press 1-9 or 0</div>
                                <div className="grid grid-cols-2 gap-x-2 gap-y-0.5">
                                    <div>1: c  (light)</div> <div>2: h  (Planck)</div>
                                    <div>3: G  (grav)</div>  <div>4: g  (9.806)</div>
                                    <div>5: e  (charge)</div><div>6: me (electron)</div>
                                    <div>7: mp (proton)</div><div>8: Na (Avogadro)</div>
                                </div>
                            </div>
                        ) : activeMenu === 'CONV' ? (
                            <div className="absolute inset-x-2 top-6 bottom-1 bg-[#eef8dd] z-20 text-[#14532d] text-[9px] font-bold p-1">
                                <div className="text-[8px] border-b border-[#14532d]/20 pb-0.5 mb-1">CONV (Press 1-8, 9, 0):</div>
                                <div className="grid grid-cols-2 gap-x-2 gap-y-0.5">
                                    <div>1: km/h➔m/s</div> <div>2: m/s➔km/h</div>
                                    <div>3: in➔cm</div>    <div>4: cm➔in</div>
                                    <div>5: ft➔m</div>     <div>6: m➔ft</div>
                                    <div>7: lb➔kg</div>    <div>8: kg➔lb</div>
                                </div>
                            </div>
                        ) : activeMenu === 'CLR' ? (
                            <div className="absolute inset-x-2 top-6 bottom-1 bg-[#eef8dd] z-20 text-[#14532d] text-[10px] font-bold p-1">
                                <div className="border-b border-[#14532d]/20 pb-0.5 mb-1">Reset? [1-3]</div>
                                <div>1: Setup Data</div>
                                <div>2: Memory Data</div>
                                <div>3: Initialize All</div>
                            </div>
                        ) : activeMenu === 'DRG' ? (
                            <div className="absolute inset-x-2 top-6 bottom-1 bg-[#eef8dd] z-20 text-[#14532d] text-[10px] font-bold p-1">
                                <div className="border-b border-[#14532d]/20 pb-0.5 mb-1">Convert Ans Angle to:</div>
                                <div>1: ° (Degrees)</div>
                                <div>2: r (Radians)</div>
                                <div>3: g (Gradians)</div>
                            </div>
                        ) : activeMenu === 'CALC_INPUT' ? (
                            <div className="absolute inset-x-2 top-6 bottom-1 bg-[#eef8dd] z-20 text-[#14532d] text-xs font-bold p-2 flex flex-col justify-between">
                                <div>X? {calcVarInput.value}<span className="cursor-blink"></span></div>
                                <div className="text-[9px] opacity-75">Enter value on keypad & press [=]</div>
                            </div>
                        ) : (
                            <>
                                {/* Expression Line with Cursor */}
                                <div 
                                    ref={scrollRef}
                                    className="text-base text-[#14532d] overflow-x-auto whitespace-nowrap scrollbar-hide w-full font-semibold tracking-wider h-7 mt-0.5 flex items-center"
                                >
                                    <span>{expression.slice(0, cursorPos)}</span>
                                    <span ref={cursorRef} className="cursor-blink"></span>
                                    <span>{expression.slice(cursorPos)}</span>
                                </div>

                                {/* Result Line with Proper Stacked Fraction Rendering (No Slash) */}
                                <div className="text-right text-2xl text-[#14532d] font-bold tracking-widest overflow-hidden mt-auto flex items-center justify-end">
                                    {renderResultDisplay(result || (expression ? '' : '0'))}
                                </div>
                            </>
                        )}
                      </>
                    )}
                </div>

                {/* --- Controls Section --- */}
                <div className="flex-1 flex flex-col gap-1">
                    
                    {/* Top Flanking Control Block with REPLAY Wheel in Center */}
                    <div className="grid grid-cols-5 gap-1.5 mb-1 items-center">
                        
                        {/* Left 2x2 Column: SHIFT, ALPHA / CALC, ∫dx */}
                        <div className="col-span-2 grid grid-cols-2 gap-1.5">
                            <CalculatorButton 
                                label="SHIFT" 
                                color="bg-[#568a2e]" 
                                isActive={isShift}
                                textClass="text-[10px] text-yellow-300 font-bold" 
                                shape="rounded-full" 
                                onClick={() => setIsShift(!isShift)}
                            />
                            <CalculatorButton 
                                label="ALPHA" 
                                color="bg-[#568a2e]" 
                                isActive={isAlpha}
                                textClass="text-[10px] text-red-300 font-bold" 
                                shape="rounded-full" 
                                onClick={() => setIsAlpha(!isAlpha)}
                            />
                            <CalculatorButton 
                                label="CALC" 
                                subShift="SOLVE" 
                                subAlpha="=" 
                                color="bg-[#1a4023]" 
                                onClick={() => {
                                    if (isAlpha) insert('=');
                                    else handleCalcKey();
                                }}
                            />
                            <CalculatorButton 
                                label="∫dx" 
                                subShift="d/dx" 
                                subAlpha=":" 
                                color="bg-[#1a4023]" 
                                onClick={() => {
                                    if (isAlpha) insert(':');
                                    else if (isShift) insert('d/dx(');
                                    else insert('∫(');
                                }}
                            />
                        </div>

                        {/* Center Column: 4-Way REPLAY Circular Disc */}
                        <div className="col-span-1 flex items-center justify-center">
                            <div className="w-[66px] h-[66px] bg-[#3f6212] rounded-full border-2 border-[#65a30d] shadow-[0_4px_10px_rgba(0,0,0,0.5)] relative flex items-center justify-center overflow-hidden">
                                <div className="absolute inset-0 rounded-full bg-gradient-to-b from-[#4d7c0f] to-[#1a2e05] opacity-90 pointer-events-none"></div>
                                <span className="text-[7px] text-[#ecfccb] font-extrabold z-10 tracking-tighter pointer-events-none">REPLAY</span>
                                
                                {/* 4-Way Click Zones */}
                                <div onClick={navigateHistoryUp} className="absolute top-0 left-0 right-0 h-5 cursor-pointer z-20 flex items-start justify-center active:bg-white/20">
                                    <span className="text-[8px] text-[#bef264] pointer-events-none mt-0.5">▲</span>
                                </div>
                                <div onClick={navigateHistoryDown} className="absolute bottom-0 left-0 right-0 h-5 cursor-pointer z-20 flex items-end justify-center active:bg-white/20">
                                    <span className="text-[8px] text-[#bef264] pointer-events-none mb-0.5">▼</span>
                                </div>
                                <div onClick={moveCursorLeft} className="absolute left-0 top-0 bottom-0 w-5 cursor-pointer z-20 flex items-center justify-start active:bg-white/20">
                                    <span className="text-[8px] text-[#bef264] pointer-events-none ml-1">◀</span>
                                </div>
                                <div onClick={moveCursorRight} className="absolute right-0 top-0 bottom-0 w-5 cursor-pointer z-20 flex items-center justify-end active:bg-white/20">
                                    <span className="text-[8px] text-[#bef264] pointer-events-none mr-1">▶</span>
                                </div>
                            </div>
                        </div>

                        {/* Right 2x2 Column: MODE, ON / x⁻¹, log_■ */}
                        <div className="col-span-2 grid grid-cols-2 gap-1.5">
                            <CalculatorButton 
                                label="MODE" 
                                subShift="SETUP" 
                                color="bg-[#568a2e]" 
                                textClass="text-[10px] text-white font-bold" 
                                shape="rounded-full" 
                                onClick={() => {
                                    if (isShift) { setActiveMenu('SETUP'); setIsShift(false); }
                                    else { setActiveMenu('MODE'); }
                                }}
                            />
                            <CalculatorButton 
                                label="ON" 
                                color="bg-[#568a2e]" 
                                textClass="text-[10px] text-white font-bold" 
                                shape="rounded-full" 
                                onClick={handlePowerOn}
                            />
                            <CalculatorButton 
                                label="x⁻¹" 
                                subShift="x!" 
                                color="bg-[#1a4023]" 
                                onClick={() => {
                                    if (isShift) insert('!');
                                    else insert('^(-1)');
                                }}
                            />
                            <CalculatorButton 
                                label="log_■" 
                                subShift="Σ" 
                                color="bg-[#1a4023]" 
                                onClick={() => {
                                    if (isShift) insert('Σ(');
                                    else insert('log_b(');
                                }}
                            />
                        </div>
                    </div>

                    {/* --- Scientific Function Grid (3 Rows x 6 Columns) --- */}
                    <div className="grid grid-cols-6 gap-1.5 mb-1">
                        
                        {/* Function Row 1: Fraction, Root, Square, Power, Log, Ln */}
                        <CalculatorButton 
                            label="믐" 
                            subShift="d/c" 
                            onClick={() => {
                                if (isShift) handleSD(true);
                                else insert('/');
                            }}
                        />
                        <CalculatorButton 
                            label="√■" 
                            subShift="³√" 
                            onClick={() => {
                                if (isShift) insert('³√(');
                                else insert('√(');
                            }}
                        />
                        <CalculatorButton 
                            label="x²" 
                            subShift="x³" 
                            onClick={() => {
                                if (isShift) insert('^3');
                                else insert('^2');
                            }}
                        />
                        <CalculatorButton 
                            label="x^■" 
                            subShift="ˣ√" 
                            onClick={() => {
                                if (isShift) insert('^(1/');
                                else insert('^');
                            }}
                        />
                        <CalculatorButton 
                            label="log" 
                            subShift="10^■" 
                            onClick={() => {
                                if (isShift) insert('10^(');
                                else insert('log(');
                            }}
                        />
                        <CalculatorButton 
                            label="ln" 
                            subShift="e^■" 
                            onClick={() => {
                                if (isShift) insert('e^(');
                                else insert('ln(');
                            }}
                        />

                        {/* Function Row 2: (-), DMS, hyp, sin, cos, tan */}
                        <CalculatorButton 
                            label="(-)" 
                            subShift="∠" 
                            subAlpha="A" 
                            onClick={() => {
                                if (isAlpha || stoActive || rclActive) handleVariableKey('A');
                                else if (isShift) insert('∠');
                                else insert('-');
                            }}
                        />
                        <CalculatorButton 
                            label="° ' ''" 
                            subShift="←" 
                            subAlpha="B" 
                            onClick={() => {
                                if (isAlpha || stoActive || rclActive) handleVariableKey('B');
                                else handleDMS();
                            }}
                        />
                        <CalculatorButton 
                            label="hyp" 
                            subAlpha="C" 
                            onClick={() => {
                                if (isAlpha || stoActive || rclActive) handleVariableKey('C');
                                else setActiveMenu('HYP');
                            }}
                        />
                        <CalculatorButton 
                            label="sin" 
                            subShift="sin⁻¹" 
                            subAlpha="D" 
                            onClick={() => {
                                if (isAlpha || stoActive || rclActive) handleVariableKey('D');
                                else if (isShift) insert('asin(');
                                else insert('sin(');
                            }}
                        />
                        <CalculatorButton 
                            label="cos" 
                            subShift="cos⁻¹" 
                            subAlpha="E" 
                            onClick={() => {
                                if (isAlpha || stoActive || rclActive) handleVariableKey('E');
                                else if (isShift) insert('acos(');
                                else insert('cos(');
                            }}
                        />
                        <CalculatorButton 
                            label="tan" 
                            subShift="tan⁻¹" 
                            subAlpha="F" 
                            onClick={() => {
                                if (isAlpha || stoActive || rclActive) handleVariableKey('F');
                                else if (isShift) insert('atan(');
                                else insert('tan(');
                            }}
                        />

                        {/* Function Row 3: RCL, ENG, (, ), S<=>D, M+ */}
                        <CalculatorButton 
                            label="RCL" 
                            subShift="STO" 
                            onClick={() => {
                                if (isShift) {
                                    setStoActive(true);
                                    setRclActive(false);
                                    setIsShift(false);
                                } else {
                                    setRclActive(true);
                                    setStoActive(false);
                                }
                            }}
                        />
                        <CalculatorButton 
                            label="ENG" 
                            subShift="←" 
                            onClick={() => {
                                if (isShift) handleENG(true);
                                else handleENG(false);
                            }}
                        />
                        <CalculatorButton 
                            label="(" 
                            subShift="%" 
                            onClick={() => {
                                if (isShift) insert('/100');
                                else insert('(');
                            }}
                        />
                        <CalculatorButton 
                            label=")" 
                            subShift="," 
                            subAlpha="X" 
                            onClick={() => {
                                if (isAlpha || stoActive || rclActive) handleVariableKey('X');
                                else if (isShift) insert(',');
                                else insert(')');
                            }}
                        />
                        <CalculatorButton 
                            label="S⇔D" 
                            subShift="a b/c" 
                            subAlpha="Y" 
                            onClick={() => {
                                if (isAlpha || stoActive || rclActive) handleVariableKey('Y');
                                else if (isShift) handleSD(true);
                                else handleSD(false);
                            }}
                        />
                        <CalculatorButton 
                            label="M+" 
                            subShift="M-" 
                            subAlpha="M" 
                            onClick={() => {
                                if (isAlpha || stoActive || rclActive) handleVariableKey('M');
                                else if (isShift) handleMemoryAdd(true);
                                else handleMemoryAdd(false);
                            }}
                        />
                    </div>

                    {/* --- Number Keypad Matrix (4 Rows x 5 Columns) --- */}
                    <div className="grid grid-cols-5 gap-1.5 mt-0.5">
                        
                        {/* Keypad Row 1: 7, 8, 9, DEL, AC */}
                        <CalculatorButton 
                            label="7" 
                            subShift="CONST" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-lg font-bold" 
                            onClick={() => {
                                if (activeMenu) handleMenuSelect('7');
                                else if (isShift) setActiveMenu('CONST');
                                else insert('7');
                            }}
                        />
                        <CalculatorButton 
                            label="8" 
                            subShift="CONV" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-lg font-bold" 
                            onClick={() => {
                                if (activeMenu) handleMenuSelect('8');
                                else if (isShift) setActiveMenu('CONV');
                                else insert('8');
                            }}
                        />
                        <CalculatorButton 
                            label="9" 
                            subShift="CLR" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-lg font-bold" 
                            onClick={() => {
                                if (activeMenu) handleMenuSelect('9');
                                else if (isShift) setActiveMenu('CLR');
                                else insert('9');
                            }}
                        />
                        <CalculatorButton 
                            label="DEL" 
                            subShift="INS" 
                            color="bg-[#f59e0b]" 
                            textColor="text-slate-950" 
                            textClass="text-sm font-extrabold" 
                            onClick={deleteChar}
                        />
                        <CalculatorButton 
                            label="AC" 
                            subShift="OFF" 
                            color="bg-[#f59e0b]" 
                            textColor="text-slate-950" 
                            textClass="text-sm font-extrabold" 
                            onClick={() => {
                                if (isShift) handlePowerOff();
                                else clearAll();
                            }}
                        />

                        {/* Keypad Row 2: 4, 5, 6, ×, ÷ */}
                        <CalculatorButton 
                            label="4" 
                            subShift="MATRIX" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-lg font-bold" 
                            onClick={() => {
                                if (activeMenu) handleMenuSelect('4');
                                else insert('4');
                            }}
                        />
                        <CalculatorButton 
                            label="5" 
                            subShift="VECTOR" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-lg font-bold" 
                            onClick={() => {
                                if (activeMenu) handleMenuSelect('5');
                                else insert('5');
                            }}
                        />
                        <CalculatorButton 
                            label="6" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-lg font-bold" 
                            onClick={() => {
                                if (activeMenu) handleMenuSelect('6');
                                else insert('6');
                            }}
                        />
                        <CalculatorButton 
                            label="×" 
                            subShift="nPr" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-xl font-bold" 
                            onClick={() => {
                                if (isShift) insert('P');
                                else insert('×');
                            }}
                        />
                        <CalculatorButton 
                            label="÷" 
                            subShift="nCr" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-xl font-bold" 
                            onClick={() => {
                                if (isShift) insert('C');
                                else insert('÷');
                            }}
                        />

                        {/* Keypad Row 3: 1, 2, 3, +, - */}
                        <CalculatorButton 
                            label="1" 
                            subShift="STAT" 
                            color="bg-[#f4fce3]" 
                            textColor="text-[#14532d]" 
                            textClass="text-lg font-bold"
